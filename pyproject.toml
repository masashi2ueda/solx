[project]
name = "solx"
version = "0.1.0"
dependencies = [
    "solidpython",
    "viewscad",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "build",
    "twine"
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["solx*"]
exclude = ["output_stl_files*", "python=3.12*"]

[tool.ruff]
select = ["E", "F", "W", "I", "D"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.ruff.isort]
known-first-party = ["solx"]