[project]
name = "solx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "python-dotenv>=1.2.2",
    "setuptools==75.8.0",
    "solidpython>=1.1.3",
    "viewscad>=0.2.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "notebook>=7.5.6",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
