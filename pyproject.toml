[project]
name = "solx"
version = "0.1.0"
dependencies = [
    "solidpython",
    "viewscad"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "build",
    "twine"
]

[tool.ruff]
select = ["E", "F", "W", "I", "D"]
ignore = [
    # D100-D104: missing docstring warnings
    "D104",
]

[tool.ruff.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.ruff.isort]
known-first-party = ["solx"]