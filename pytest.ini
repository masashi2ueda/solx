[tool:pytest]
# Pytest configuration for solx project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests  
    unit: marks tests as unit tests
    rendering: marks tests that require OpenSCAD rendering

# Coverage options (if pytest-cov is installed)
# addopts = --cov=solx --cov-report=html --cov-report=term-missing

# Minimum Python version
minversion = 6.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning